name: MarktRadar Qualitätssicherung
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check app.js
      - run: node --check netlify/functions/catalog.js
      - run: node --check functions/api/catalog.js
      - run: node --check worker.js
      - run: node --test tests/cloudflare.test.cjs tests/worker.test.cjs tests/ui.test.cjs

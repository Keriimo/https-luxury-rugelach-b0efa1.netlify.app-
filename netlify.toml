[build]
  command = "node --check app.js && node --check netlify/functions/catalog.js && mkdir -p dist && cp index.html app.js dist/"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200
